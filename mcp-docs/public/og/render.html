<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FYP MCP Docs OG</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        font-family:
          'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #f7fdf9;
        background-image: radial-gradient(circle, rgba(34, 197, 94, 0.14) 1px, transparent 1px);
        background-size: 18px 18px;
        color: #14532d;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 56px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .badge {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #16a34a;
        border: 2px solid rgba(34, 197, 94, 0.35);
        padding: 8px 14px;
        border-radius: 6px;
        background: rgba(34, 197, 94, 0.08);
      }
      .title {
        font-size: 52px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.03em;
        max-width: 900px;
      }
      .title span {
        background: linear-gradient(90deg, #16a34a, #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .subtitle {
        margin-top: 20px;
        font-size: 22px;
        line-height: 1.45;
        color: #166534;
        max-width: 820px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        font-size: 16px;
        color: #15803d;
      }
      .url {
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: linear-gradient(90deg, #22c55e, #06b6d4, #22c55e);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="badge">MCP Server Docs</div>
      </div>
      <div>
        <div class="title">Feel Your Protocol <span>MCP Docs</span></div>
        <p class="subtitle">
          Deterministic future-protocol simulations for AI agents — concrete reference, tools, and
          technical setup.
        </p>
      </div>
      <div class="footer">
        <span class="url">mcp-docs.feelyourprotocol.org</span>
        <span>Machine Room · Terminal Green</span>
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
