id: eip-7843

title: 'EIP-7843 The Feel: Read the Beacon Slot On-Chain (Amsterdam) #Shorts'

description: |
  SLOTNUM reads the beacon slot the consensus layer already wrote on the block header — no TIMESTAMP ÷ 12.

  Part of the Amsterdam execution-layer rules. This short steps EIP-7843 opcode 0x4b on slot 42, watches the stack push 0x2a, then runs the divide-by-twelve trap (a different number). The same bytecode on Osaka treats 0x4b as an invalid opcode.

  Explore it interactively:
  https://feelyourprotocol.org/eip-7843-slotnum-opcode

  Spec: https://eips.ethereum.org/EIPS/eip-7843

