title: 'EIP-8037 Under the Hood: State Gas vs 21,000 (Amsterdam) #Shorts'

description: |
  EIP-8037 splits gas into execution and state — a first-touch ETH transfer no longer fits in 21,000.

  Part of the Amsterdam execution-layer rules. This short runs a 1-wei transfer to an empty account, shows execution staying around 21,000 while state gas is about 183,600, then drops the limit to 21,000 so the send fails. The same transfer on Osaka still goes through. Funded recipients stay cheap; a new storage slot also bills state gas.

  Explore it interactively:
