shape: thread

t1:
  body: |
    EIP-2780 · Glamsterdam
    The flat intrinsic splits into sender, recipient touch, and value. A self-send keeps only the sender piece.

    Would a 12,000 self-send still fit the quote you ship?

    https://feelyourprotocol.org/eip-2780-intrinsic-transaction-gas
  media: eip-2780-2026-09-29T09-30-43-final.mp4
  video_description: |
    Vertical short for EIP-2780. The title card asks why a self-send is only
    12,000. The widget runs a value transfer on Glamsterdam: 12,000 for the
    sender, 3,000 to touch the recipient, and 6,000 to move the value, still
    21,000. A self-send drops to 12,000. A call with no value is 15,000.
    Fusaka puts the flat 21,000 back. Voice-over points to Forkcast and
    feelyourprotocol.org.
