id: eip-2780

title: 'EIP-2780 Self-send stays at 12,000 (Glamsterdam) #Shorts'

description: |
  A value transfer still totals 21,000. A self-send keeps only the 12,000 sender piece.

  EIP-2780 replaces the flat intrinsic charge on Glamsterdam. The short runs three shapes: a send to someone else (12,000 + 3,000 + 6,000), a self-send (12,000), and a call that moves no value (15,000). Fusaka still charges 21,000 for all three.

