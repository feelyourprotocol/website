id: eip-8038

title: 'EIP-8038 The Split: Touch, Change, Create (Amsterdam) #Shorts'

description: |
  EIP-8038 prices an SSTORE as touch, change, and create — the write is no longer one fused number.

  Part of the Amsterdam execution-layer rules. This short runs an existing-slot SSTORE so touch stays 2,100 while change jumps to 10,000, then writes an empty slot and bills create as state gas (about 97,920). Osaka still fuses the write; Amsterdam prices the three parts apart.

  Explore it interactively:
  https://feelyourprotocol.org/eip-8038-state-access-gas

  Spec: https://eips.ethereum.org/EIPS/eip-8038

