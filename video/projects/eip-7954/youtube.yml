title: 'EIP-7954 Raises Contract Size Limits (Glamsterdam) #Shorts'

description: |
  EIP-7954 raises deployed runtime code from 24 KiB to 64 KiB and initcode from 48 KiB to 128 KiB.

  Part of the Glamsterdam hardfork. This short compares the same deployment boundaries on Fusaka and Glamsterdam: runtime code one byte beyond the old wall and initcode one byte beyond its old wall. Glamsterdam accepts both while keeping the new ceilings as hard limits.

  Explore it interactively:
