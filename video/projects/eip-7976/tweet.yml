id: eip-7976

# Re-record after the calldata field landed. Comic already opened on the floor.
# Video tweet leads with 64 versus 4 and 16, then a wallet-quote diagnostic.
shape: thread

t1:
  body: |
    EIP-7976 · Glamsterdam
    Little work prices every calldata byte at 64. Real work keeps 4 and 16.

    Would a wallet quote built on 10 and 40 still cover a hundred zero bytes?

    https://feelyourprotocol.org/eip-7976-calldata-floor-cost
  media: eip-7976-2026-10-01T14-19-20-final.mp4
  video_description: |
    Vertical short for EIP-7976. The title card asks when calldata costs 64
    gas per byte. The widget shows one hundred zero-byte marks, then the floor
    of 6,400 that sets the price on Glamsterdam. Fusaka drops that floor to
    1,000. Nonzero bytes fill the same field; the floor still wins, and 40
    becomes 64. A call that does real work keeps 16 per byte. An access list
    with no calldata still pays 64 per listed byte on Glamsterdam. Voice-over
    points to Forkcast and feelyourprotocol.org.
  intent: https://x.com/intent/post?text=EIP-7976%20%C2%B7%20Glamsterdam%0ALittle%20work%20prices%20every%20calldata%20byte%20at%2064.%20Real%20work%20keeps%204%20and%2016.%0A%0AWould%20a%20wallet%20quote%20built%20on%2010%20and%2040%20still%20cover%20a%20hundred%20zero%20bytes%3F%0A%0Ahttps%3A%2F%2Ffeelyourprotocol.org%2Feip-7976-calldata-floor-cost

