id: eip-7976

title: 'EIP-7976 In 60 Seconds: Calldata Floor at 64 (Glamsterdam) #Shorts'

description: |
  Calldata costs 64 gas per byte when the call does little else, and 4 or 16 when the call does real work.

  EIP-7976 raises the calldata floor on Glamsterdam. The short shows one hundred zero bytes (the floor is 6,400, and that is the price), the same zeros on Fusaka (floor 1,000), one hundred nonzero bytes (40 becomes 64), a call that does real work (each byte stays at 16), and an access list with no calldata (those listed bytes still pay 64 on Glamsterdam).

  Explore it interactively:
  https://feelyourprotocol.org/eip-7976-calldata-floor-cost

