# Comic already opened on REFUND. Video tweet leads with the bill versus the block.
shape: thread

t1:
  body: |
    EIP-7778 · Glamsterdam
    A storage clear still pays you back. The block keeps the full charge.

    Would your block builder still treat that refund as free space?

    https://feelyourprotocol.org/eip-7778-block-gas-accounting
  media: eip-7778-2026-10-04T13-59-09-final.mp4
  video_description: |
    Vertical short for EIP-7778. The title card asks why a storage clear still
    leaves the block counting the full gas. On Glamsterdam the widget shows
    you pay less than the block counts. The same clear on Fusaka shows one
    number. A rewrite matches on both. Putting the original value back stays
    cheap for the block, and the extra refund still comes off the bill only.
    Voice-over points to Forkcast and feelyourprotocol.org.
