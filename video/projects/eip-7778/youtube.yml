id: eip-7778

title: 'EIP-7778 The refund stays on the bill (Glamsterdam) #Shorts'

description: |
  A storage clear still pays you back. On Glamsterdam the block keeps the full charge.

  EIP-7778 leaves refunds on the sender bill. The short clears a slot on Glamsterdam (you pay less than the block counts), runs the same clear on Fusaka (one number), rewrites a slot with no refund, and puts the original value back. Restoring the original stays cheap for the block. The extra refund still comes off the bill only.

  Explore it interactively:
  https://feelyourprotocol.org/eip-7778-block-gas-accounting

