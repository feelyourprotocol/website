id: eip-7708

title: 'EIP-7708 Explained: Native ETH Transfers Emit a Log (Amsterdam) #Shorts'

description: |
  EIP-7708 makes native ETH visible to log filters — every non-zero move emits an ERC-20-style Transfer log.

  Part of the Amsterdam execution-layer rules shipping in the Glamsterdam hardfork. This short runs a plain ETH transfer, watches the Transfer log fire from the system address, then switches the same transaction to Osaka to show the receipt stay silent. Zero-value moves and reverted calls stay silent too.

  Explore it interactively:
  https://feelyourprotocol.org/eip-7708-eth-transfer-logs

  Spec: https://eips.ethereum.org/EIPS/eip-7708
