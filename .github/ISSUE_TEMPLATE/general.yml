name: "\U0001F4AC General / Question"
description: Ask a question, suggest an improvement, or discuss an idea.
title: "[Discussion] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for questions, feature ideas, or anything that doesn't fit the other templates.

        **Docs:** [How to Contribute](https://website-docs.feelyourprotocol.org/contributing/how-to-contribute.html) · [Architecture](https://website-docs.feelyourprotocol.org/guide/architecture.html)

  - type: textarea
    id: description
    attributes:
      label: What's on your mind?
      description: Describe your question, idea, or suggestion.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or references that help explain.
