name: Run Unit Tests
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [master]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Skip tests (label)
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'skip tests')
        run: echo "Unit tests skipped via 'skip tests' label."

      - uses: actions/checkout@v5
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip tests')

      - name: Checkout mcp-gateway (matching PR branch)
        if: (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip tests')) && github.event_name == 'pull_request'
        id: gateway_pr_branch
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: feelyourprotocol/mcp-gateway
          ref: ${{ github.head_ref }}
          path: mcp-gateway

      - name: Checkout mcp-gateway (main)
        if: (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip tests')) && (github.event_name != 'pull_request' || steps.gateway_pr_branch.outcome != 'success')
        uses: actions/checkout@v5
        with:
          repository: feelyourprotocol/mcp-gateway
          ref: main
          path: mcp-gateway

      - name: Use Node.js 22
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip tests')
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip tests')
        run: npm ci

      - name: Run unit tests
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip tests')
        run: npm run test:unit:ci
