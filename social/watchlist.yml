# X engagement watchlist — query families and problem lexicon.
# Playbook: .cursor/skills/x-engagement/
# Not a handle allowlist. Do not add VIP lists; diversity is the point.
#
# Keep problem_slices in sync with src/explorations/REGISTRY.ts
# (skip sunset). Paths from each info.ts.

schema: fyp-x-watchlist/v1
account: FeelEthereum
cooldown_days: 5
max_actions_per_run: 5
prefer_actions_per_run: 3
max_weather_links: 10

# Automation Memories (see x-engagement/reference.md § Memory). Injected every run — keep small.
memory:
  max_chars: 4000
  max_watch: 8
  max_seen: 30
  seen_days: 14

# Handles never to suggest (no @). Cooldown handles from Memories are extra.
always_exclude:
  - FeelEthereum

# Round A — always one "moved" search, then ONE rotating family (broad first).
# Depth queries: only if moved + broad came back thin. Do not spray a family.
weather_moved:
  label: What moved
  prompt: >-
    What moved in Ethereum protocol on X in this date window?
    Scope: execution layer, clients (Geth Nethermind Reth Erigon Besu EthereumJS),
    AllCoreDevs ACDE ACDC, hardforks (Glamsterdam Amsterdam EL Fusaka),
    EIPs, EVM gas precompiles, client releases, spec fights.
    Skip: price, ETF, ETH/USD, staking yield, restaking, L2 airdrops,
    memecoins, gm, city Amsterdam, sports.

weather_families:
  fork_acd:
    label: Fork / ACD
    broad:
      - AllCoreDevs ACDE Ethereum
    depth:
      - Glamsterdam CFI Amsterdam EL
      - Ethereum hardfork inclusion EL
      - Forkcast Amsterdam
  clients:
    label: Clients / implementations
    broad:
      - Ethereum execution client
    depth:
      - Geth Reth Nethermind Besu Erigon
      - ethereumjs EVM
  mechanics:
    label: Mechanic talk
    broad:
      - EVM gas Ethereum protocol
    depth:
      - Ethereum EIP spec execution
      - Ethereum gas schedule precompile
      - EVM receipts logs access list

problem_slices:
  - id: eip-8037
    path: /eip-8037-state-creation-gas
    core_question: Why isn't 21,000 gas enough for a simple ETH transfer anymore?
    search:
      - wallet gas limit 21000 Ethereum
      - first-touch ETH transfer gas
      - empty account creation cost Ethereum
      - state creation gas Ethereum
    avoid_leading_with: EIP-8037
  - id: eip-7708
    path: /eip-7708-eth-transfer-logs
    core_question: When does native ETH show up as a Transfer log — and when does it stay invisible to log filters?
    search:
      - native ETH Transfer log
      - indexer missing ETH transfer
      - ETH transfer not in receipt logs
      - SYSTEM_ADDRESS Transfer Ethereum
    avoid_leading_with: EIP-7708
  - id: eip-7928
    path: /eip-7928-block-level-access-lists
    core_question: What does the block commit to besides state root?
    mcp_docs: planned-module
    search:
      - block-level access list Ethereum
      - Ethereum BAL parallel IO
      - blockAccessListHash
    avoid_leading_with: EIP-7928
  - id: eip-7951
    path: /eip-7951-secp256r1-precompile
    core_question: Why add a secp256r1 precompile?
    search:
      - Ethereum passkey secp256r1
      - P-256 precompile Ethereum
      - WebAuthn L1 Ethereum
    avoid_leading_with: EIP-7951
  - id: eip-8024
    path: /eip-8024-stack-opcodes-dupn-swapn-exchange
    core_question: How do you reach deep stack items without blowing the 1024 limit?
    search:
      - Solidity stack too deep
      - DUPN SWAPN EXCHANGE EVM
      - Ethereum stack opcodes compiler
    avoid_leading_with: EIP-8024
  - id: eip-7883
    path: /eip-7883-modexp-gas-cost-increase
    core_question: How are ModExp gas costs changing with Fusaka?
    search:
      - ModExp gas Ethereum
      - precompile 0x05 RSA 4337
      - modular exponentiation gas Fusaka
    avoid_leading_with: EIP-7883

# Last-resort ids if a hit already names an EIP (live only). Not a daily rotation.
eip_number_fallback:
  - eip-8037
  - eip-7708
  - eip-7928
  - eip-7951
  - eip-8024
  - eip-7883
