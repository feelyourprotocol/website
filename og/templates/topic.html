<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{PAGE_TITLE}}</title>
    <style>{{BASE_STYLES}}</style>
  </head>
  <body>
    <div class="card">
      <div class="accent-bar"></div>
      <div class="topic-content">
        <div class="topic-kicker">Research Topic</div>
        <h1 class="topic-title">{{PAGE_TITLE}}</h1>
        <p class="topic-description">{{DESCRIPTION}}</p>
        <div class="topic-meta">
          <div class="count-badge">{{EXPLORATION_COUNT}} {{EXPLORATION_LABEL}}</div>
          <div class="topic-badge">{{TOPIC_TITLE}}</div>
        </div>
        {{THUMB_ROW}}
      </div>
      <footer class="footer">
        <img src="{{LOGO_URL}}" alt="" />
        <div class="brand">Feel Your Protocol</div>
        <div class="tagline">{{TAGLINE}}</div>
      </footer>
    </div>
  </body>
</html>
