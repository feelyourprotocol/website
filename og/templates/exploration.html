<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    <style>{{BASE_STYLES}}</style>
  </head>
  <body>
    <div class="card">
      <div class="accent-bar"></div>
      <div class="content">
        {{COVER_BLOCK}}
        <div class="main">
          <div class="spec-label">{{SPEC_LABEL}}</div>
          <h1 class="title">{{TITLE}}</h1>
          <p class="description">{{DESCRIPTION}}</p>
          <div class="topic-badge">{{TOPIC_TITLE}}</div>
        </div>
      </div>
      <footer class="footer">
        <img src="{{LOGO_URL}}" alt="" />
        <div class="brand">Feel Your Protocol</div>
        <div class="tagline">{{TAGLINE}}</div>
      </footer>
    </div>
  </body>
</html>
